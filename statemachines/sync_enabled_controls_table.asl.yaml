Comment: "A state machine that syncs Security Hub controls for all accounts where Security Hub is enabled."
StartAt: ListAccounts
States:
    ListAccounts:
        Type: Task
        Resource: "${ListAccountsFunctionArn}"
        ResultPath: "$.account_ids"
        Retry:
            - ErrorEquals:
                  - AWSTransientError
                  - States.Timeout
                  - Lambda.ServiceException
                  - Lambda.AWSLambdaException
                  - Lambda.SdkClientException
                  - Lambda.TooManyRequestsException
              IntervalSeconds: 5
              MaxAttempts: 20
              BackoffRate: 2
              MaxDelaySeconds: 300
              JitterStrategy: FULL
        Next: MapSyncTasks

    MapSyncTasks:
        Type: Map
        InputPath: $
        ItemsPath: "$.account_ids"
        MaxConcurrency: 0
        Iterator:
            StartAt: SyncSecurityHubControls
            States:
                SyncSecurityHubControls:
                    Type: Task
                    Resource: "${SyncEnabledControlsTableFunctionArn}"
                    Parameters:
                        "account_id.$": "$"
                    Retry:
                        - ErrorEquals:
                              - AWSTransientError
                              - States.Timeout
                              - Lambda.ServiceException
                              - Lambda.AWSLambdaException
                              - Lambda.SdkClientException
                              - Lambda.TooManyRequestsException
                          IntervalSeconds: 5
                          MaxAttempts: 20
                          BackoffRate: 2
                          MaxDelaySeconds: 300
                          JitterStrategy: FULL
                    End: true
        End: true

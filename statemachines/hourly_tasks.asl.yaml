Comment: "A state machine that sends reminders for overdue tickets."
StartAt: Get Overdue Tickets
States:
    Get Overdue Tickets:
        Type: Task
        Resource: "${GetOverdueTicketsFunctionArn}"
        ResultPath: "$.overdue_tickets"
        Retry:
            - ErrorEquals:
                  - AWSTransientError
                  - States.Timeout
                  - Lambda.ServiceException
                  - Lambda.AWSLambdaException
                  - Lambda.SdkClientException
                  - Lambda.TooManyRequestsException
              IntervalSeconds: 5
              MaxAttempts: 20
              BackoffRate: 2
              MaxDelaySeconds: 300
              JitterStrategy: FULL
        Next: Process Overdue Tickets

    Process Overdue Tickets:
        Type: Map
        InputPath: $
        ItemsPath: "$.overdue_tickets"
        MaxConcurrency: 0
        Iterator:
            StartAt: Process Overdue Ticket
            States:
                Process Overdue Ticket:
                    Type: Task
                    Resource: "${ConsiderOverdueTicketFunctionArn}"
                    ResultPath: "$.send_reminder"
                    Retry:
                        - ErrorEquals:
                              - AWSTransientError
                              - States.Timeout
                              - Lambda.ServiceException
                              - Lambda.AWSLambdaException
                              - Lambda.SdkClientException
                              - Lambda.TooManyRequestsException
                          IntervalSeconds: 5
                          MaxAttempts: 20
                          BackoffRate: 2
                          MaxDelaySeconds: 300
                          JitterStrategy: FULL
                    Next: Send Reminder?

                Send Reminder?:
                    Type: Choice
                    Choices:
                        -
                            Variable: $.send_reminder
                            StringEquals: "Yes"
                            Next: Format Reminder Email
                    Default: Don't Send Reminder

                Format Reminder Email:
                    Type: Task
                    Resource: "${FormatTicketOverdueMessageFunctionArn}"
                    Retry:
                        - ErrorEquals:
                              - AWSTransientError
                              - States.Timeout
                              - Lambda.ServiceException
                              - Lambda.AWSLambdaException
                              - Lambda.SdkClientException
                              - Lambda.TooManyRequestsException
                          IntervalSeconds: 5
                          MaxAttempts: 20
                          BackoffRate: 2
                          MaxDelaySeconds: 300
                          JitterStrategy: FULL
                    Next: Send Email

                Send Email:
                    Type: Task
                    Resource: '${SendEmailFunctionArn}'
                    Parameters:
                        Recipient.$: $.TeamEmail
                        Subject.$: $.messages.email.subject
                        Body.$: $.messages.email.body
                        Html.$: $.messages.email.html
                        AdditionalCC.$: $.AdditionalCC
                    ResultPath: null
                    Retry:
                        -
                            ErrorEquals:
                                - AWSTransientError
                                - States.Timeout
                                - Lambda.ServiceException
                                - Lambda.AWSLambdaException
                                - Lambda.SdkClientException
                                - Lambda.TooManyRequestsException
                            IntervalSeconds: 5
                            MaxAttempts: 20
                            BackoffRate: 2
                            MaxDelaySeconds: 300
                            JitterStrategy: FULL
                    Next: Record Reminder Sent

                Record Reminder Sent:
                    Type: Task
                    Resource: '${RecordReminderSentFunctionArn}'
                    ResultPath: null
                    Retry:
                        -
                            ErrorEquals:
                                - AWSTransientError
                                - States.Timeout
                                - Lambda.ServiceException
                                - Lambda.AWSLambdaException
                                - Lambda.SdkClientException
                                - Lambda.TooManyRequestsException
                            IntervalSeconds: 5
                            MaxAttempts: 20
                            BackoffRate: 2
                            MaxDelaySeconds: 300
                            JitterStrategy: FULL
                    End: true

                Don't Send Reminder:
                    Type: Succeed

        End: true
